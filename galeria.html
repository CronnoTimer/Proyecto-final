<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Los Vikingos - Galería</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Contenedor general centrado */
    .galeria-container {
      max-width: 900px;
      margin: 2rem auto;
      background: white;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 1rem;
    }

    /* Ocultamos radio botones */
    input[type="radio"] {
      display: none;
    }

    /* Tabs (botones para seleccionar sección) */
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .tab-label {
      padding: 0.5rem 1rem;
      background-color: #ddd;
      color: #333;
      cursor: pointer;
      border-radius: 4px;
      margin: 0 0.5rem;
      transition: background-color 0.3s ease;
    }

    .tab-label:hover {
      background-color: #bbb;
    }

    /* Mostrar tab activo */
    input[type="radio"]:checked + .tab-label {
      background-color: #333;
      color: white;
    }

    /* Contenido de cada sección (oculto por defecto) */
    .tab-content {
      display: none;
      padding: 1rem;
    }

    /* Mostrar contenido cuando el radio button esté checked */
    #tab1:checked ~ .tab-content.tab1,
    #tab2:checked ~ .tab-content.tab2,
    #tab3:checked ~ .tab-content.tab3 {
      display: block;
    }

    /* Grid para las imágenes */
    .imagenes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .imagenes-grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .imagenes-grid img:hover {
      transform: scale(1.05);
    }

    /* Descripción debajo de cada grupo */
    .caption {
      text-align: center;
      margin-top: 0.5rem;
      font-weight: bold;
      font-size: 1.2rem;
      color: #333;
    }

  </style>
</head>
<body>
  <!-- Encabezado con navegación -->
  <header>
    <img src="galeria/VikingosLogo.png" alt="Logo de Los Vikingos" class="logo" />
    <nav>
      <ul>
        <li><a href="index.html">Menú Principal</a></li>
        <li><a href="menuComida.html">Menú Comida</a></li>
        <li><a href="galeria.html">Galería</a></li>
        <li><a href="promociones.html">Promociones</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenedor de la galería con tabs -->
  <main>
    <div class="galeria-container">
      <!-- Radio buttons ocultos para control de tabs -->
      <input type="radio" name="tabs" id="tab1" checked />
      <input type="radio" name="tabs" id="tab2" />
      <input type="radio" name="tabs" id="tab3" />

      <!-- Tabs (botones) -->
      <div class="tabs">
        <label for="tab1" class="tab-label">Locales</label>
        <label for="tab2" class="tab-label">Platillos</label>
        <label for="tab3" class="tab-label">Eventos</label>
      </div>

      <!-- Contenido de cada tab -->
      <div class="tab-content tab1">
        <div class="imagenes-grid">
          <img src="galeria/Local2016.jpg" alt="Food Truck Los Vikingos" />
          <img src="galeria/LocalFeria.jpg" alt="Food Truck Laterales" />
          <img src="vikingos_foto6.jpg" alt="Food Truck Posterior" />
        </div>
        <div class="caption">Food Truck Los Vikingos</div>
      </div>

      <div class="tab-content tab2">
        <div class="imagenes-grid">
          <img src="galeria/Vikingo.jpg" alt="Tacos Vikingos" />
          <img src="galeria/Piojito.jpg" alt="Taco Piojito" />
          <img src="galeria/Hotdogs.jpg" alt="Hot Dogs Perrones" />
          <img src="galeria/Hamburguesa.jpg" alt="Hamburguesas Especiales" />
        </div>
        <div class="caption">Nuestros Platillos</div>
      </div>

      <div class="tab-content tab3">
        <div class="imagenes-grid">
          <img src="galeria/Evento.jpg" alt="Evento Los Vikingos" />
          <img src="galeria/EventoFiesta.jpg" alt="Fiesta con Los Vikingos" />
          <img src="galeria/MotoReparto.jpg" alt="Servicio a domicilio" />
          <img src="galeria/Cliente.jpg" alt="Clientes disfrutando" />
        </div>
        <div class="caption">Eventos y Clientes</div>
      </div>
    </div>
  </main>

  <!-- Pie de página con datos de contacto -->
  <footer>
    <p>
      Contacto: Nombre: Estudiante, Materia: Desarrollo Web, Correo: ejemplo@restaurante.com,
      Teléfono: 123-456-7890
    </p>
  </footer>
</body>
</html>
